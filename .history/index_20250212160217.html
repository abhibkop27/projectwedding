<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div class="mandala"></div>
        <div class="content">
            <div class="om">ॐ</div>
            <h1 class="invite">Wedding Invitation</h1>
            <div class="names">
                <span class="bride">Anil</span>
                <span class="and">&</span>
                <span class="groom">Pradnya</span>
            </div>
            <div class="details">
                <p class="date">On Thursday, February  20, 2025</p>
                <p class="time">At 12:21 PM</p>
                <p class="venue">Reshimgathi Sanskrutik Bhavan
                    <br>Spurti Chowk, Sangli<br>
                    <a href="https://maps.app.goo.gl/NcRUe2sYRECoGc8g8" target="_blank">Get a Location</a></p>
            </div>
            <button class="modal-trigger">Accept</button>

        <div class="decorative-border"></div>
    </div>
    
    <div class="modal" id="weddingModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="form-header">
                <p style="margin: 20px;">Thank you for accepting our invitation—we’re so excited to celebrate with you on our special day</p>
            </div>
        </div>
</div>
    <script src="main.js"></script>
</body>
</html>
